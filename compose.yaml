# docker compose up --build       the whole app on http://localhost:3000
#
# Without ANTHROPIC_API_KEY the answers are extractive (sentences from the top passages);
# retrieval, refusal and the verifier work the same. With a key in your shell, Claude answers:
#   ANTHROPIC_API_KEY=... docker compose up --build
# Your own documents instead of the demo handbook:
#   GROUNDED_DOCS_DIR=/path/to/docs docker compose up --build
# Removed files stay in the index; `docker compose down -v` starts from an empty one.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: grounded
      POSTGRES_PASSWORD: grounded
      POSTGRES_DB: grounded
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - grounded-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grounded -d grounded"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      GROUNDED_DATABASE_URL: postgresql://grounded:grounded@db:5432/grounded
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ${GROUNDED_DOCS_DIR:-./demo/docs}:/docs:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  grounded-db:
